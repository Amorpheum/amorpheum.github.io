<footer class="footer">
  <div class="container footer__inner">
    <div>
      <p>© {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
      <p class="footer__note">{{ site.author.employer }}, {{ site.author.location }}. Design language shared with <a href="https://www.cailab.info/design-language/">CAILab</a>.</p>
    </div>
    <nav class="footer__links" aria-label="Footer">
      {% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
      <a href="{{ site.author.googlescholar }}">Google Scholar</a>
      <a href="{{ site.author.orcid }}">ORCID</a>
      <a href="https://github.com/{{ site.author.github }}">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </nav>
  </div>
</footer>
