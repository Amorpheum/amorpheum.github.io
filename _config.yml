# kennychoo.net. Built by GitHub's legacy Pages pipeline, which uses its own pinned github-pages gem set.
# `jekyll serve` does not reload this file; restart it after a change.
# A local preview needs `--config _config.yml,_config.dev.yml` (see CLAUDE.md).

locale      : "en-US"
title       : "Kenny Choo"
description : "Kenny Choo — Assistant Professor at SUTD, directing the Context-Aware Interaction Lab. Research on Human-Centred AI: designing and studying AI systems that people can understand, question, and act with, in sensitive, high-stakes settings."
url         : https://kennychoo.net # production host; must match CNAME (tests/site_test.rb checks)
baseurl     : ""
og_image    : "og-image.png" # in /images/; layouts prepend the path, so keep this a bare filename

# Owner details used by the layouts.
author:
  name           : "Kenny Choo"
  bio            : "HCI researcher working on Human-Centred AI for sensitive, high-stakes settings"
  location       : "Singapore"
  employer       : "SUTD"
  email          : "kennytwchoo@gmail.com"
  googlescholar  : "https://scholar.google.com/citations?user=B9HCv0oAAAAJ&hl=en"
  orcid          : "https://orcid.org/0000-0003-3845-9143"
  github         : "amorpheum"

# We bring our own layouts and stylesheet; without this the github-pages gem adds its default theme.
theme: null

# Talks dated in the future (an upcoming invited talk) still publish.
future: true
timezone: Asia/Singapore

include:
  - _pages
  - files
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - bin
  - tests
  - tools
  - vendor

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# The site has no posts, so the feed at /feed.xml carries the talks. jekyll-feed always builds a posts feed too;
# it is moved aside (unlinked, empty) so it does not occupy /feed.xml.
feed:
  collections:
    talks:
      path: /feed.xml
    posts:
      path: /feed/posts.xml
