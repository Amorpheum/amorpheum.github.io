# Sidecar for _pages/publications.md generation (tools/render_publications.py).
#
# publications.bib (personal/cv/) only goes back to 2018. These pre-2018
# entries were already public on the site and are NOT in the bib, so they
# are hand-carried here rather than silently dropped on regeneration.
# If they get added to the CV bib later, delete them from here.
#
# `by_key`: extra links (video/dataset/local pdf) keyed by bib entry ID,
#           merged onto a bib-sourced entry.
# `extra_entries`: whole entries not present in the bib at all, given as
#           pre-formatted markdown lines plus a sort year.

