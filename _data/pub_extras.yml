# Sidecar for _data/publications.yml generation (tools/render_publications.py).
#
# publications.bib (personal/cv/) only goes back to 2018. These pre-2018
# entries were already public on the site and are NOT in the bib, so they
# are hand-carried here rather than silently dropped on regeneration.
# If they get added to the CV bib later, delete them from here.
#
# `by_key`: extra links (video/dataset/local pdf) keyed by bib entry ID,
#           merged onto a bib-sourced entry. `date` (YYYY[-MM[-DD]]) orders
#           the entry when the bib has no month, or a month other than when
#           the paper became public (earliest public availability, the same
#           rule as the CAILab site's publications.yml). Its year must equal
#           the printed year or the generator stops.
#           `areas` lists the paper's research areas (slugs in _data/areas.yml), for the area pills
#           and the Research area filter; none means "Other". The CAILab site's research.yml is
#           canonical for these; a test compares the two by title when that repo sits beside this one.
# `extra_entries`: whole entries not present in the bib at all, as records: year, type (one of
#           publication_types.yml; the bib has no keyword for these six, so the type is a judgement),
#           title, authors (Markdown), venue, links, and optionally areas.

